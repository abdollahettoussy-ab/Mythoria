<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Fantasy Trading Card Game</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
</head>

<body class="bg-[url('img/Gbg.png')]">

    <header>
        <div class="flex flex-col px-2 py-2 text-3xl backdrop-blur-md mb-px font-[custom-property] w-48 h-full">

            <div class="w-44 h-15 mx-10">
                <img src="img/logo.png" alt="" class="w-full h-full object-contain ml-[-40px]">
            </div>

            <div class="flex flex-col gap-6 text-white my-4 mx-10">
                <a href="index.html">Home</a>
                <a href="Bouster.html">Bouster-Shop</a>
                <a href="open.html">Open-Bousters</a>
                <a href="Grimoir.html">My Grimoir</a>
                <a href="Deck.html">Deck</a>
                <li><a href="MYTHORIA2/arena.html">Arena</a></li>
            </div>

        </div>

        <style>
            #mes-cartes {
                scrollbar-width: none;
                -ms-overflow-style: none;
            }

            #mes-cartes::-webkit-scrollbar {
                width: 0;
                height: 0;
                display: none;
            }
        </style>

    </header>

    <div class="   w-[1170px] h-[750px] ml-[250px] mt-[-420px]">

        <!-- Les cartes -->
        <div class="  w-[490px] h-[680px] ml-[25px] mt-[35px]">

            <section class="p-6">



                <div id="mes-cartes"
                    class="grid grid-cols-2 gap-2 h-[550px] overflow-y-auto overflow-x-hidden content-start p-2 ">
                </div>

            </section>

        </div>

        <!-- Details de la carte -->
        <div class="ml-[630px]    mt-[-680px] w-[500px] h-[680px]">

            <div id="details-carte"></div>

        </div>

        <p></p>

    </div>

    <script>
        const conteneurCartes = document.querySelector('#mes-cartes');
        const detailsCarte = document.querySelector('#details-carte');

        let mesCartes = JSON.parse(localStorage.getItem('mesCartes')) || [];

        // Afficher les cartes dans la partie gauche
        function afficherCartes() {
            conteneurCartes.innerHTML = '';

            mesCartes.forEach((chemin, index) => {
                const carte = document.createElement('div');

                carte.className = 'flex flex-col items-center gap-2 cursor-pointer';

                const image = document.createElement('img');

                image.src = chemin;
                image.alt = 'Carte ' + (index + 1);
                image.className = 'w-full rounded-xl shadow-lg';

                image.addEventListener('click', function () {
                    afficherDetails(index);
                });

                carte.appendChild(image);
                conteneurCartes.appendChild(carte);
            });
        }

        // Afficher les details de la carte choisie
        function afficherDetails(index) {
            const chemin = mesCartes[index];

            detailsCarte.innerHTML = '';

            const image = document.createElement('img');
            image.src = chemin;
            image.alt = 'Carte choisie';
            image.className = 'w-full max-w-[350px] mx-auto mt-6';

            const titre = document.createElement('h2');
            titre.className = 'text-2xl text-white text-center mt-4';

            // Afficher le nom du fichier comme titre
            const nomFichier = chemin.split('/').pop();
            titre.textContent = nomFichier.substring(0, nomFichier.lastIndexOf('.')) || nomFichier;

            const boutonSupprimer = document.createElement('button');
            boutonSupprimer.textContent = 'Supprimer la carte';
            boutonSupprimer.className = 'block mx-auto mt-6 px-4 py-2 border border-white text-white cursor-pointer';

            boutonSupprimer.addEventListener('click', function () {
                mesCartes.splice(index, 1);

                localStorage.setItem('mesCartes', JSON.stringify(mesCartes));

                detailsCarte.innerHTML = '';

                afficherCartes();
            });

            detailsCarte.appendChild(image);
            detailsCarte.appendChild(titre);
            detailsCarte.appendChild(boutonSupprimer);
        }

        // Lancer l'affichage
        afficherCartes();
    </script>

</body>

</html>
