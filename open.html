<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Fantasy Trading Card Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">

</head>

<body class="bg-blue-400">
    <header class="fixed top-0 left-0 right-0 z-[9999] w-full">
        <div class="flex justify-between px-2 py-2 text-3xl backdrop-blur-md mb-px font-[custom-property] ">
            <div class="w-48 h-15 mx-10">
                <img src="img/logo.png" alt="" class="w-full h-full object-contain  ">
            </div>
            <nav aria-label="navigation se">
                <ul class="flex gap-6 text-white my-4 mx-10 ">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="Bouster.html">Bouster-Shop</span></a></li>
                    <li><a href="open.html">Open-Bousters</a></li>
                    <li><a href="Grimoir.html">My Grimoir</a></li>
                    <li><a href="Deck.html">Deck</a></li>

                </ul>
            </nav>
        </div>
        <style>
            #pack-container {
                scrollbar-width: none;
                -ms-overflow-style: none;
            }

            #pack-container::-webkit-scrollbar {
                display: none;
            }
        </style>
    </header>
    <div id="pack-container"
        class="flex flex-nowrap overflow-x-auto overflow-y-hidden gap-2 font-[custom-property] mt-24 text-2xl"></div>
    <div id="cartes-container" 
        class="flex flex-wrap justify-center gap-6 mt-8"></div>

</body>
<script>


const container = document.querySelector('#pack-container');

//  dossier cartes
const cartes = [
    'cartes/legend.jpg',
    'cartes/legend1.jpg',
    'cartes/legend2.jpg',
    'cartes/legend3.jpg',
    'cartes/créature5.png',
    'cartes/créature0.png',
    'cartes/créature1.png',
    'cartes/créature2.png',
    'cartes/créature3.png',
    'cartes/créature4.png',
    'cartes/créature6.png',
    'cartes/créature7.png',
    'cartes/héro4.png',
    'cartes/héro1.png',
    'cartes/héro2.png',
    'cartes/héros0.png',
    'cartes/héro3.png',
    'cartes/sort0.png',
    'cartes/sort1.png',
    
];

const texte = localStorage.getItem('panier');

if (container && texte) {
    const produits = JSON.parse(texte);

    produits.forEach(pack => {
        const bloc = document.createElement('div');
        const image = document.createElement('img');
        const titre = document.createElement('h2');
        const prix = document.createElement('p');
        const bouton = document.createElement('button');

        image.src = pack.image;
        image.alt = pack.titre;
        image.className =
            'w-[300px] transition-all duration-700 ease-in-out';

        titre.textContent = pack.titre;
        prix.textContent = pack.prix + ' DH';

        bouton.textContent = 'Open';
        bouton.className =
            'bg-purple-700 hover:bg-purple-500 text-white font-bold px-6 py-2 rounded-lg cursor-pointer transition duration-300 shadow-lg';

        bloc.className =
            'flex flex-col items-center gap-3 shrink-0';

        bloc.append(image, titre, prix, bouton);
        container.append(bloc);

        bouton.addEventListener('click', () => {
            if (bouton.disabled) return;

            bouton.disabled = true;

            
            image.classList.add('animate-bounce');

            setTimeout(() => {
                
                const melanges = [...cartes];

                for (let i = melanges.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [melanges[i], melanges[j]] =
                        [melanges[j], melanges[i]];
                }

                const cartesChoisies = melanges.slice(0, 5);

               
                const anciennesCartes =
                    JSON.parse(localStorage.getItem('mesCartes')) || [];

                
                const nouvellesCartes = [
                    ...anciennesCartes,
                    ...cartesChoisies
                ];

                localStorage.setItem(
                    'mesCartes',
                    JSON.stringify(nouvellesCartes)
                );

                
                image.classList.remove('animate-bounce');
                image.classList.add(
                    '-translate-y-32',
                    'opacity-0',
                    'scale-75'
                );

                setTimeout(() => {
                    bloc.remove();
                }, 700);

                alert(
                    'Pack ouvert ! 5 cartes ajoutées à ton Grimoir.'
                );
            }, 1000);
        });
    });
}


</script>

</html>
